name: Feature request
description: Suggest something Moontop should do
labels: [enhancement]
assignees: [justinh-rahb]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not just the solution. "When I'm ... I want to ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Moontop to do?
      description: How it might look or which keys it might use. If Mainsail or Fluidd already does this, say how.
  - type: textarea
    id: printer
    attributes:
      label: Printer setup
      description: If it depends on hardware or macros (AFC, toolchangers, specific Klipper objects), describe yours.
